protocols = imap
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout
ssl = yes
ssl_cert = </etc/dovecot/cert.pem
ssl_key = </etc/dovecot/key.pem
disable_plaintext_auth = no
auth_mechanisms = plain login xoauth2
mail_location = maildir:/mail/%u
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000
passdb {
 driver = oauth2
 mechanisms = xoauth2
 args = /etc/dovecot/oauth2.conf
}
passdb {
 driver = static
 args = password=test-password
 mechanisms = plain login
}
userdb {
 driver = static
 args = uid=vmail gid=vmail home=/mail/%u
}
namespace inbox {
 inbox = yes
 mailbox Sent {
  auto = subscribe
  special_use = \Sent
 }
}
service imap-login {
 inet_listener imap {
  port = 143
 }
 inet_listener imaps {
  port = 993
  ssl = yes
 }
}
