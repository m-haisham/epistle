name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: epistle
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p epistle-server
      - run: docker compose up -d --build dovecot mock
      - run: python3 tests/integration.py
      - run: docker compose build epistle
      - run: python3 tests/token_expiry.py --image epistle-epistle:latest
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
