# Defaults < optional epistle.toml < environment variables (uppercase field names).
data_dir = "./data"
bind_addr = "127.0.0.1:8080"
public_url = "https://email.example.com"
webhook_url = "https://app.example.com/webhooks/email"
# Set API_KEY, MASTER_KEY (32 random bytes as hex), and WEBHOOK_SECRET in the environment.
file_retention_secs = 7200
inline_body_cap = 262144
index_retention_secs = 2592000
reconcile_secs = 180
watchdog_secs = 60
fetch_batch_count = 50
fetch_batch_bytes = 26214400
max_attempts = 12
disk_reserve_bytes = 268435456
reauth_reminder_secs = 0
allow_insecure_test_endpoints = false
