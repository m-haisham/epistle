[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
epistle-api = { path = "crates/api", version = "0.1.0" }
epistle-auth = { path = "crates/auth", version = "0.1.0" }
epistle-core = { path = "crates/core", version = "0.1.0" }
epistle-delivery = { path = "crates/delivery", version = "0.1.0" }
epistle-email = { path = "crates/email", version = "0.1.0" }
epistle-imap = { path = "crates/imap", version = "0.1.0" }
epistle-store = { path = "crates/store", version = "0.1.0" }

aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-query"] }
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
config = { version = "0.15.27", default-features = false, features = ["toml"] }
fs2 = "0.4.3"
futures = "0.3.31"
hex = "0.4.3"
hmac = "0.13.0"
imap-proto = "0.17.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
mail-parser = "1.0.0"
rand = "0.10.3"
schemars = { version = "0.9.0", features = ["chrono04"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
subtle = "2.6.1"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
tokio-util = { version = "0.7.16", features = ["io", "rt"] }
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
webpki-roots = "1.0.11"
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.dependencies.async-imap]
version = "0.12.0"
default-features = false
features = ["runtime-tokio"]

[workspace.dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["json", "form", "rustls"]

[workspace.dependencies.sqlx]
version = "0.9.0"
default-features = false
features = ["runtime-tokio", "sqlite", "migrate", "macros"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
