services:
  dovecot:
    build: ./infra/dovecot
    ports:
      - "127.0.0.1:1143:143"
    depends_on: [mock]
  mock:
    image: python:3.13-slim
    command: python /mock.py
    volumes:
      - ./infra/mock.py:/mock.py:ro
    ports:
      - "127.0.0.1:8090:8090"
  epistle:
    build: .
    stop_grace_period: 5m
    environment:
      EPISTLE_SERVER__BIND_ADDR: 0.0.0.0:8080
      EPISTLE_SERVER__API_KEY: local-test-api-key-0000000000000000
      EPISTLE_AUTH__MASTER_KEY: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      EPISTLE_DELIVERY__WEBHOOK_URL: http://mock:8090/webhook
      EPISTLE_DELIVERY__WEBHOOK_SECRET: local-test-webhook-secret-00000000
      EPISTLE_TESTING__ALLOW_INSECURE_ENDPOINTS: "true"
      EPISTLE_SERVER__PUBLIC_URL: http://localhost:8080
      EPISTLE_TESTING__TOKEN_ENDPOINT_OVERRIDE: http://mock:8090/token
      EPISTLE_AUTH__GOOGLE__CLIENT_ID: local-test
      EPISTLE_AUTH__GOOGLE__CLIENT_SECRET: local-test
      EPISTLE_MAIL__RECONCILE_SECS: 2
      EPISTLE_STORAGE__DISK_RESERVE_BYTES: 0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - epistle-data:/home/epistle/data
    depends_on: [dovecot, mock]
volumes:
  epistle-data:
